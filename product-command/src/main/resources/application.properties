# Propósito: Define el nombre identificativo de este microservicio dentro del ecosistema de Spring Cloud (por ejemplo, cuando se registra en un servidor de descubrimiento como Eureka o ante un servidor de configuración centralizado).
spring.application.name=product-command

# Propósito: Configura el puerto de red en el que se ejecutará el servidor embebido (Tomcat por defecto) de este microservicio.
# Escuchará peticiones HTTP en el puerto 8081 (evitando conflictos si levantas otros servicios en el puerto por defecto 8080).
server.port=8081

# Propósito: Le indica a Spring Cloud Stream cuál es la función de Java (un bean de tipo Consumer, Function o Supplier) que debe conectar y exponer utilizando el modelo de programación funcional.
# En este caso, apunta a un componente llamado handlerCommands.
spring.cloud.function.definition=handlerCommands

# Propósito: Conecta la entrada (-in-0) de nuestra función handlerCommands con un tópico físico específico en el sistema de mensajería.
# Le dice que los mensajes que procese esta función provendrán del tópico de Kafka llamado product-commands
spring.cloud.stream.bindings.handlerCommands-in-0.destination=product-commands

# Propósito: Define el formato de serialización/deserialización de los datos que viajan por ese canal.
# Especifica que los mensajes entrantes se interpretarán y convertirán automáticamente desde texto en formato application/json a objetos de Java (y viceversa).
spring.cloud.stream.bindings.handlerCommands-in-0.content-type=application/json

# Propósito: Configura la dirección de red (host y puerto) del broker o servidor de Apache Kafka al que debe conectarse el binder.
# En este caso, apunta a localhost:9092 (típicamente el puerto expuesto por un contenedor Docker de Kafka en tu máquina de desarrollo).
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# Propósito: Establece la URL de conexión JDBC que utilizará el pool de conexiones (HikariCP) para comunicarse con la base de datos relacional.
# Indica que se usará el driver de MySQL para conectarse a localhost en el puerto 3306 a la base de datos llamada db_spring_kafka.
spring.datasource.url=jdbc:mysql://localhost:3306/db_spring_kafka

# Propósito: Define las credenciales de acceso (usuario y contraseña) requeridas por el motor de base de datos MySQL para autenticar la conexión del microservicio.
spring.datasource.username=root
spring.datasource.password=sasa1234

# Propósito: Configura el comportamiento automático de Hibernate sobre la estructura de la base de datos.
# La opción update le indica a Spring que, al arrancar, analice tus entidades JPA y actualice o cree las tablas y columnas necesarias de forma automática sin borrar los datos existentes (muy útil en etapas de desarrollo local).
spring.jpa.hibernate.ddl-auto=update

# Propósito: Activa la visualización en la consola de la aplicación de todas las sentencias SQL que Hibernate genera por debajo al ejecutar operaciones con la base de datos (ideal para depurar y entender qué consultas se están mandando a MySQL).
spring.jpa.show-sql=true

# Propósito: Especifica el tipo de contenido o formato multimedia que espera recibir el consumidor para este enlace en particular (JSON),
# garantizando la deserialización correcta de los mensajes entrantes.
spring.cloud.stream.bindings.handlerCommands-in-0.contentType=application/json

# Propósito: Define el nombre del grupo de consumidores (Consumer Group) para este microservicio en Kafka (en este caso, product-command).
# Es fundamental en sistemas de mensajería para que Kafka gestione el reparto de particiones y asegure que, si escalas tu microservicio,
# los mensajes no se dupliquen de forma indebida entre instancias.
spring.cloud.stream.bindings.handlerCommands-in-0.group=product-command

# Propósito: Configura la posición inicial de lectura (offset) en el tópico de Kafka cuando el consumidor se conecta por primera vez
# y no tiene un offset previo registrado. La opción 'latest' le indica que comience a leer únicamente los mensajes nuevos que lleguen
# a partir de su conexión, ignorando los eventos históricos o anteriores almacenados en el tópico.
spring.cloud.stream.kafka.bindings.handlerCommands-in-0.consumer.start-offset=latest


# Propósito: Define el destino (tópico físico de Kafka) al cual se enviarán los mensajes generados por la salida (out-0) de nuestra función handlerCommands.
# Asegura que las respuestas o eventos resultantes se publiquen en el tópico product-replies.
spring.cloud.stream.bindings.handlerCommands-out-0.destination=product-replies

# Propósito: Especifica el formato multimedia o tipo de contenido (application/json) para la serialización de los mensajes
# que salen a través de este enlace, garantizando que se envíen correctamente estructurados como texto JSON hacia el broker.
spring.cloud.stream.bindings.handlerCommands-out-0.contentType=application/json

