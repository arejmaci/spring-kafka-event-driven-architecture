# Nombre que Spring Boot asigna a esta aplicación.
spring.application.name=products-api
# Puerto HTTP en el que se inicia el servidor.
server.port=8080
# Asocia el canal de salida productCommand-out-0 con el tópico product-commands de Kafka.
spring.cloud.stream.bindings.productCommand-out-0.destination=product-commands
# Indica que los mensajes enviados por este canal tienen formato JSON.
spring.cloud.stream.bindings.productCommand-out-0.content-type=application/json
# Dirección del broker de Kafka al que se conecta la aplicación.
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# Registra handleReplyConsumer como la función consumidora de mensajes de respuesta.
spring.cloud.function.definition=handleReplyConsumer
# Asocia la entrada de handleReplyConsumer con el tópico product-replies de Kafka.
spring.cloud.stream.bindings.handleReplyConsumer-in-0.destination=product-replies
# Indica que los mensajes recibidos por este canal tienen formato JSON.
spring.cloud.stream.bindings.handleReplyConsumer-in-0.content-type=application/json
# Identificador del grupo consumidor; los consumidores del grupo comparten la lectura de mensajes.
spring.cloud.stream.bindings.handleReplyConsumer-in-0.group=product-api
# Empieza a leer desde los mensajes nuevos, sin consumir los anteriores al inicio del grupo.
spring.cloud.stream.kafka.bindings.handleReplyConsumer-in-0.consumer.start-offset=latest
